# Modified for Xuzhou, 2026-10-15: independent identity and mandatory release-license gate.
appId: local.xuzhou.workbench.beta
productName: 续舟
executableName: Xuzhou
copyright: Based on AionUi. Copyright 2025 AionUi (aionui.com). See bundled NOTICE.

protocols: []

asar:
  smartUnpack: true

directories:
  app: release-app
  output: out
  buildResources: resources

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!out/renderer/branding/compliance/release-policy.json'
  - '!**/{profile,profile-local,sessions-local,backup,backups,evidence,.codex,.kiro,.ssh}/**'
  - '!**/{auth,credentials,secrets}.json'
  - '!**/*.pem'
  - from: out/main/static
    to: static

extraResources:
  - from: resources/workbench
    to: workbench
  - from: resources/workbench/node_modules
    to: workbench/node_modules
  - from: public
    to: .
  - from: public/branding/app.png
    to: app.png
  # aioncore binary (pre-compiled per platform/arch, ships its own bun runtime)
  - from: resources/bundled-aioncore
    to: bundled-aioncore
  - from: resources/hub
    to: hub
win:
  target:
    - nsis
    #    - msi
  icon: public/branding/app.ico # Use the checked-in Windows icon resource for executable metadata/icon patching
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  differentialPackage: false

mac:
  target:
    - dmg
    - zip
  icon: public/branding/app.icns
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist

dmg:
  # Use UDZO format which is more reliable on CI
  format: UDZO
  # Disable internet-enabled DMG to avoid network issues
  internetEnabled: false
  # Simple window settings to avoid layout issues
  window:
    width: 540
    height: 380
  # Contents positioning
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

beforePack: scripts/licensing/verify.cjs
afterPack: scripts/afterPack.js
afterSign: scripts/afterSign.js

linux:
  target:
    - deb
  icon: public/branding/app.png
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  category: Utility
  maintainer: Xuzhou contributors
  vendor: Xuzhou
  synopsis: ${description}
  description: ${description}
  desktop:
    entry:
      Name: 续舟
      Comment: ${description}
      Icon: Xuzhou
      Categories: Office;Utility;
      MimeType: x-scheme-handler/aionui;

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

asarUnpack:
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/bcrypt/**/*'
  - '**/node_modules/node-pty/**/*'
  - '**/node_modules/@mapbox/**/*'
  - '**/node_modules/detect-libc/**/*'
  - '**/node_modules/prebuild-install/**/*'
  - '**/node_modules/node-gyp-build/**/*'
  - '**/node_modules/bindings/**/*'
  # open library and dependencies - needed for Windows asar compatibility
  - '**/node_modules/open/**/*'
  - '**/node_modules/default-browser/**/*'
  - '**/node_modules/default-browser-id/**/*'
  - '**/node_modules/run-applescript/**/*'
  - '**/node_modules/bundle-name/**/*'
  # tree-sitter WASM files need to be unpacked for fs.readFile access
  - '**/node_modules/web-tree-sitter/**/*'
  - '**/node_modules/tree-sitter-bash/**/*'
  # Builtin MCP server scripts must be unpacked so external node processes can execute them
  - 'out/main/builtin-mcp-image-gen.js'
  - 'out/main/builtin-mcp-browser.js'
  - 'out/main/team-mcp-stdio.js'

# Compression level: normal for faster builds, maximum for smallest size
# Note: electron-builder doesn't support YAML template syntax for env vars
# The build script sets ELECTRON_BUILDER_COMPRESSION_LEVEL env var which takes precedence
compression: normal
removePackageScripts: true
electronDownload:
  cache: ${env.ELECTRON_CACHE}

# No upstream publication or update feed for this derivative.
publish: null

# Xuzhou runtime bridge is copied as code only; user profiles are never bundled.
